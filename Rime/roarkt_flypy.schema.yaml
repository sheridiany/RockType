# Rime schema
# encoding: utf-8
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Xiaohe double-pinyin algebra and preedit rules are adapted from
# rime/rime-double-pinyin double_pinyin_flypy.schema.yaml.

schema:
  schema_id: roarkt_flypy
  name: RockType Shuangpin
  version: "0.6.0"
  author:
    - double pinyin layout by 鹤
    - Rime schema by 佛振
    - adapted for RockType by RockType contributors
  description: 小鹤双拼与英文原词候选；双向翻译显示在独立操作栏。
  dependencies:
    - roarkt_en

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]
  - name: simplification
    reset: 1
    # 强制启用繁转简，不提供菜单开关。
  - name: full_shape
    reset: 0
    states: [半角, 全角]

# Both Shift keys switch persistently; inline_ascii would revert after commit.
ascii_composer:
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear

menu:
  page_size: 5

engine:
  processors:
    - lua_processor@*roarkt_candidate_snapshot
    - ascii_composer
    - recognizer
    - lua_processor@*roarkt_candidate_session
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - table_translator@english
    - lua_translator@*roarkt_english_echo
  filters:
    - simplifier@simplification
    - lua_filter@*roarkt_simplified_only_filter
    - uniquifier
    # Order visible candidates after simplification and deduplication.
    - lua_filter@*roarkt_candidate_filter

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^xx$/
    # 双拼编码前先扩展常用模糊音，使全拼与双拼保持一致的容错能力。
    - derive/^([zcs])h/$1/
    - derive/^([zcs])([^h])/$1h$2/
    - derive/^n/l/
    - derive/^l/n/
    - derive/([ei])n$/$1ng/
    - derive/([ei])ng$/$1n/
    - derive/^([jqxy])u$/$1v/
    - derive/^([aoe])([ioun])$/$1$1$2/
    - xform/^([aoe])(ng)?$/$1$1$2/
    - xform/iu$/Q/
    - xform/(.)ei$/$1W/
    - xform/uan$/R/
    - xform/[uv]e$/T/
    - xform/un$/Y/
    - xform/^sh/U/
    - xform/^ch/I/
    - xform/^zh/V/
    - xform/uo$/O/
    - xform/ie$/P/
    - xform/i?ong$/S/
    - xform/ing$|uai$/K/
    - xform/(.)ai$/$1D/
    - xform/(.)en$/$1F/
    - xform/(.)eng$/$1G/
    - xform/[iu]ang$/L/
    - xform/(.)ang$/$1H/
    - xform/ian$/M/
    - xform/(.)an$/$1J/
    - xform/(.)ou$/$1Z/
    - xform/[iu]a$/X/
    - xform/iao$/N/
    - xform/(.)ao$/$1C/
    - xform/ui$/V/
    - xform/in$/B/
    - xlit/QWRTYUIOPSDFGHJKLZXCVBNM/qwrtyuiopsdfghjklzxcvbnm/

translator:
  dictionary: roarkt_zh
  prism: roarkt_flypy
  contextual_suggestions: true
  enable_completion: true
  enable_sentence: true
  enable_user_dict: true
  initial_quality: 1.2
  max_homographs: 7
  max_homophones: 7
  preedit_format:
    - xform/([bpmfdtnljqx])n/$1iao/
    - xform/(\w)g/$1eng/
    - xform/(\w)q/$1iu/
    - xform/(\w)w/$1ei/
    - xform/([dtnlgkhjqxyvuirzcs])r/$1uan/
    - xform/(\w)t/$1ve/
    - xform/(\w)y/$1un/
    - xform/([dtnlgkhvuirzcs])o/$1uo/
    - xform/(\w)p/$1ie/
    - xform/([jqx])s/$1iong/
    - xform/(\w)s/$1ong/
    - xform/(\w)d/$1ai/
    - xform/(\w)f/$1en/
    - xform/(\w)h/$1ang/
    - xform/(\w)j/$1an/
    - xform/([gkhvuirzcs])k/$1uai/
    - xform/(\w)k/$1ing/
    - xform/([jqxnl])l/$1iang/
    - xform/(\w)l/$1uang/
    - xform/(\w)z/$1ou/
    - xform/([gkhvuirzcs])x/$1ua/
    - xform/(\w)x/$1ia/
    - xform/(\w)c/$1ao/
    - xform/([dtgkhvuirzcs])v/$1ui/
    - xform/(\w)b/$1in/
    - xform/(\w)m/$1ian/
    - xform/([aoe])\1(\w)/$1$2/
    - "xform/(^|[ '])v/$1zh/"
    - "xform/(^|[ '])i/$1ch/"
    - "xform/(^|[ '])u/$1sh/"
    - xform/([jqxy])v/$1u/
    - xform/([nl])v/$1ü/

grammar:
  language: zh-hant-t-essay-bgw
  collocation_max_length: 5
  collocation_min_length: 2

english:
  dictionary: roarkt_en
  enable_completion: true
  enable_sentence: false
  enable_user_dict: true
  initial_quality: 1.2
  comment_format:
    - xform/.+/〔EN〕/

simplification:
  option_name: simplification
  opencc_config: tw2s.json
  tips: none

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
