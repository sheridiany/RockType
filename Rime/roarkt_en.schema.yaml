# Rime schema
# encoding: utf-8

schema:
  schema_id: roarkt_en
  name: RockType English Dictionary
  version: "0.2.0"
  author:
    - RockType contributors
  description: RockType 主方案的英文词典编译依赖，不单独显示在方案列表。

engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - table_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"

translator:
  dictionary: roarkt_en
  enable_completion: true
  enable_sentence: false
  enable_user_dict: true
