# Rime schema
# encoding: utf-8

schema:
  schema_id: roarkt
  name: RockType Pinyin
  version: "0.5.0"
  author:
    - RockType contributors
  description: >-
    中文拼音与英文原词候选；双向翻译显示在独立操作栏。
  dependencies:
    - roarkt_en

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]
  - name: full_shape
    reset: 0
    states: [半角, 全角]

# Both Shift keys switch persistently; inline_ascii would revert after commit.
ascii_composer:
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear

menu:
  page_size: 5

engine:
  processors:
    - lua_processor@*roarkt_candidate_snapshot
    - ascii_composer
    - recognizer
    - lua_processor@*roarkt_candidate_session
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - table_translator@english
    - lua_translator@*roarkt_english_echo
  filters:
    - lua_filter@*roarkt_simplified_only_filter
    - uniquifier
    # Factory dictionary is simplified; order visible candidates after deduplication.
    - lua_filter@*roarkt_candidate_filter

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    # 常用模糊音：覆盖最常见的声母、前后鼻音混淆，不扩大到方言级规则。
    - derive/^([zcs])h/$1/
    - derive/^([zcs])([^h])/$1h$2/
    - derive/^n/l/
    - derive/^l/n/
    - derive/([ei])n$/$1ng/
    - derive/([ei])ng$/$1n/
    # 简拼与常见拼写、按键纠错，规则取自鼠须管自带 pinyin.yaml。
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ve$/$1ue/correction
    - derive/^([jqxy])u/$1v/correction
    - derive/un$/uen/correction
    - derive/ui$/uei/correction
    - derive/iu$/iou/correction
    - derive/([aeiou])ng$/$1gn/correction
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/correction
    - derive/ong$/on/correction
    - derive/ao$/oa/correction
    - derive/([iu])a(o|ng?)$/a$1$2/correction
    - erase/^xx$/

translator:
  dictionary: roarkt_zh
  # The retained traditional gram model must not rerank simplified committed context.
  contextual_suggestions: false
  enable_completion: true
  enable_sentence: true
  enable_user_dict: true
  initial_quality: 1.2
  max_homographs: 7
  max_homophones: 7

grammar:
  language: zh-hant-t-essay-bgw
  collocation_max_length: 5
  collocation_min_length: 2

english:
  dictionary: roarkt_en
  enable_completion: true
  enable_sentence: false
  enable_user_dict: true
  initial_quality: 1.2
  comment_format:
    - xform/.+/〔EN〕/

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
