# Rocky Linux 9: install ONLY as /etc/nginx/conf.d/type.roarkist.com.conf.
# HTTP bootstrap. certbot --nginx owns subsequent TLS/redirect directives.
# Do not overwrite this live file during routine content deployments.
server {
    listen 80;
    listen [::]:80;
    server_name type.roarkist.com;
    root /var/www/rocktype/current;
    index index.html;
    charset utf-8;
    autoindex off;
    open_file_cache off; # current changes atomically between releases.
    access_log /var/log/nginx/rocktype.access.log;
    error_log /var/log/nginx/rocktype.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    gzip on;
    gzip_types text/css application/javascript text/plain application/xml;
    gzip_vary on;
    location / { expires -1; try_files $uri $uri/ =404; }
    location /assets/ { expires 1h; try_files $uri =404; }
    location ~ \.(css|js)$ { expires 5m; try_files $uri =404; }
    location ~ /\. { return 404; }
    location ^~ /deploy/ { return 404; }
    location = /README.md { return 404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
